<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MovieMate – Login</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-box {
      background-color: #1a1a2e;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .auth-logo h1 { font-size: 2rem; }
    .auth-logo h1 span { color: #7B5FFF; }
    .auth-logo p { color: #aaa; margin-top: 6px; font-size: 0.9rem; }
    .auth-tabs {
      display: flex;
      margin-bottom: 28px;
      border-bottom: 2px solid #2a2a3e;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      color: #aaa;
      font-weight: 600;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }
    .auth-tab.active {
      color: #7B5FFF;
      border-bottom-color: #7B5FFF;
    }
    .auth-form { display: none; }
    .auth-form.active { display: block; }
    .auth-footer {
      text-align: center;
      margin-top: 20px;
      color: #aaa;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-logo">
        <h1>Movie<span>Mate</span></h1>
        <p>Your personal movie & TV watchlist</p>
      </div>

      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchTab('login')">Log In</div>
        <div class="auth-tab" onclick="switchTab('register')">Sign Up</div>
      </div>

      <!-- Login Form -->
      <div id="login-form" class="auth-form active">
        <div id="login-alert"></div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="Enter your email"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" placeholder="Enter your password"/>
        </div>
        <button class="btn btn-primary btn-full" onclick="handleLogin()">Log In</button>
      </div>

      <!-- Register Form -->
      <div id="register-form" class="auth-form">
        <div id="register-alert"></div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="reg-username" placeholder="Choose a username"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="Enter your email"/>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="reg-password" placeholder="Create a password"/>
        </div>
        <button class="btn btn-primary btn-full" onclick="handleRegister()">Create Account</button>
      </div>

      <div class="auth-footer">MovieMate &copy; 2025 – Group 7</div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (getCurrentUser()) window.location.href = 'pages/home.html';

    function switchTab(tab) {
      document.querySelectorAll('.auth-tab').forEach((t, i) => {
        t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
      });
      document.getElementById('login-form').classList.toggle('active', tab === 'login');
      document.getElementById('register-form').classList.toggle('active', tab === 'register');
    }

    function showAlert(id, msg, type = 'error') {
      document.getElementById(id).innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
    }

    function handleLogin() {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) return showAlert('login-alert', 'Please fill in all fields.');
      const result = loginUser(email, password);
      if (result.success) window.location.href = 'pages/home.html';
      else showAlert('login-alert', result.message);
    }

    function handleRegister() {
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      if (!username || !email || !password) return showAlert('register-alert', 'Please fill in all fields.');
      if (password.length < 6) return showAlert('register-alert', 'Password must be at least 6 characters.');
      const result = registerUser(username, email, password);
      if (result.success) {
        showAlert('register-alert', 'Account created! Logging you in...', 'success');
        loginUser(email, password);
        setTimeout(() => window.location.href = 'pages/home.html', 1000);
      } else showAlert('register-alert', result.message);
    }

    // Allow Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        if (document.getElementById('login-form').classList.contains('active')) handleLogin();
        else handleRegister();
      }
    });
  </script>
</body>
</html>
