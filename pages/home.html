<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MovieMate – Home</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">Movie<span>Mate</span></div>
    <ul class="navbar-nav">
      <li><a href="home.html" class="active">Home</a></li>
      <li><a href="search.html">Search</a></li>
      <li><a href="watchlist.html">Watchlist</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="#" onclick="logoutUser()">Logout</a></li>
    </ul>
  </nav>

  <div class="section">
    <h2 class="section-title">🔥 Trending This Week</h2>
    <div id="trending-grid" class="movies-grid">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>

    <h2 class="section-title" style="margin-top:32px;">🎬 Popular Movies</h2>
    <div id="popular-movies-grid" class="movies-grid">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>

    <h2 class="section-title" style="margin-top:32px;">📺 Popular TV Shows</h2>
    <div id="popular-tv-grid" class="movies-grid">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>

  <!-- Movie Detail Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/watchlist.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const user = requireAuth();

    function createCard(item) {
      const type = item.media_type || (item.title ? 'movie' : 'tv');
      const card = document.createElement('div');
      card.className = 'movie-card';
      card.innerHTML = `
        <img src="${getImageURL(item.poster_path)}" alt="${getTitle(item)}" loading="lazy"/>
        <div class="movie-card-info">
          <div class="movie-card-title">${getTitle(item)}</div>
          <div class="movie-card-rating">⭐ ${getRating(item)}</div>
        </div>`;
      card.onclick = () => openModal(item.id, type);
      return card;
    }

    function renderGrid(containerId, items) {
      const el = document.getElementById(containerId);
      el.innerHTML = '';
      if (!items || items.length === 0) {
        el.innerHTML = '<p style="color:#aaa">Nothing to show right now.</p>';
        return;
      }
      items.slice(0, 12).forEach(item => el.appendChild(createCard(item)));
    }

    async function openModal(id, type) {
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById('modal-content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
      const movie = await getMovieDetails(id, type);
      const inList = isInWatchlist(movie.id);
      const genres = (movie.genres || []).map(g => `<span class="badge">${g.name}</span>`).join('');
      document.getElementById('modal-content').innerHTML = `
        <div class="modal-movie">
          <img class="modal-poster" src="${getImageURL(movie.poster_path)}" alt="${getTitle(movie)}"/>
          <div class="modal-info">
            <h2>${getTitle(movie)}</h2>
            <div class="modal-meta">
              ${getYear(movie)} &bull; ${movie.runtime || movie.number_of_seasons + ' seasons' || ''} &bull; ⭐ ${getRating(movie)}
            </div>
            <div style="margin-bottom:12px">${genres}</div>
            <p class="modal-overview">${movie.overview || 'No description available.'}</p>
            <button class="btn ${inList ? 'btn-outline' : 'btn-primary'}" onclick="toggleWatchlistBtn(${movie.id}, ${JSON.stringify(getTitle(movie)).replace(/"/g, '&quot;')}, '${movie.poster_path}', '${type}', this)">
              ${inList ? '✓ In Watchlist' : '+ Add to Watchlist'}
            </button>
          </div>
        </div>`;
    }

    function toggleWatchlistBtn(id, title, poster, type, btn) {
      if (isInWatchlist(id)) {
        removeFromWatchlist(id);
        btn.className = 'btn btn-primary';
        btn.textContent = '+ Add to Watchlist';
      } else {
        addToWatchlist({ id, title, poster_path: poster, media_type: type });
        btn.className = 'btn btn-outline';
        btn.textContent = '✓ In Watchlist';
      }
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    async function loadHome() {
      const [trending, movies, tv] = await Promise.all([fetchTrending(), getPopular('movie'), getPopular('tv')]);
      renderGrid('trending-grid', trending);
      renderGrid('popular-movies-grid', movies);
      renderGrid('popular-tv-grid', tv);
    }

    loadHome();
  </script>
</body>
</html>
