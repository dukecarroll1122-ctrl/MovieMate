<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MovieMate – Home</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">Movie<span>Mate</span></div>
    <ul class="navbar-nav">
      <li><a href="home.html" class="active">Home</a></li>
      <li><a href="search.html">Search</a></li>
      <li><a href="watchlist.html">Watchlist</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="#" onclick="logoutUser()">Logout</a></li>
    </ul>
  </nav>

  <div class="section">
    <h2 class="section-title">🔥 Trending This Week</h2>
    <div id="trending-grid" class="movies-grid">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>

    <h2 class="section-title" style="margin-top:32px;">🎬 Popular Movies</h2>
    <div id="popular-movies-grid" class="movies-grid">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>

    <h2 class="section-title" style="margin-top:32px;">📺 Popular TV Shows</h2>
    <div id="popular-tv-grid" class="movies-grid">
      <div class="loading"><div class="spinner"></div>Loading...</div>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/watchlist.js"></script>
  <script src="../js/app.js"></script>
  <script>
    requireAuth();

    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    async function loadHome() {
      const [trending, movies, tv] = await Promise.all([
        fetchTrending(), getPopular('movie'), getPopular('tv')
      ]);
      renderGrid('trending-grid', trending);
      renderGrid('popular-movies-grid', movies);
      renderGrid('popular-tv-grid', tv);
    }

    loadHome();
  </script>
</body>
</html>
