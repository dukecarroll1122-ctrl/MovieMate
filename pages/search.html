<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MovieMate – Search</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">Movie<span>Mate</span></div>
    <ul class="navbar-nav">
      <li><a href="home.html">Home</a></li>
      <li><a href="search.html" class="active">Search</a></li>
      <li><a href="watchlist.html">Watchlist</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="#" onclick="logoutUser()">Logout</a></li>
    </ul>
  </nav>

  <div class="section">
    <h2 class="section-title">🔍 Search Movies & TV Shows</h2>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search for a movie or TV show..." />
      <button class="btn btn-primary" onclick="doSearch()">Search</button>
    </div>
    <div id="search-results"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/watchlist.js"></script>
  <script>
    requireAuth();

    async function doSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;
      const container = document.getElementById('search-results');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';
      const results = await searchMovies(query);
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No results found</h3><p>Try a different search term.</p></div>';
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'movies-grid';
      results.forEach(item => {
        const type = item.media_type || 'movie';
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.innerHTML = `
          <img src="${getImageURL(item.poster_path)}" alt="${getTitle(item)}" loading="lazy"/>
          <div class="movie-card-info">
            <div class="movie-card-title">${getTitle(item)}</div>
            <div class="movie-card-rating">⭐ ${getRating(item)} &bull; ${type === 'tv' ? 'TV' : 'Movie'}</div>
          </div>`;
        card.onclick = () => openModal(item.id, type);
        grid.appendChild(card);
      });
      container.appendChild(grid);
    }

    async function openModal(id, type) {
      document.getElementById('modal-overlay').classList.add('active');
      document.getElementById('modal-content').innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
      const movie = await getMovieDetails(id, type);
      const inList = isInWatchlist(movie.id);
      const genres = (movie.genres || []).map(g => `<span class="badge">${g.name}</span>`).join('');
      document.getElementById('modal-content').innerHTML = `
        <div class="modal-movie">
          <img class="modal-poster" src="${getImageURL(movie.poster_path)}" alt="${getTitle(movie)}"/>
          <div class="modal-info">
            <h2>${getTitle(movie)}</h2>
            <div class="modal-meta">${getYear(movie)} &bull; ⭐ ${getRating(movie)}</div>
            <div style="margin-bottom:12px">${genres}</div>
            <p class="modal-overview">${movie.overview || 'No description available.'}</p>
            <button class="btn ${inList ? 'btn-outline' : 'btn-primary'}" onclick="toggleWatchlistBtn(${movie.id}, '${movie.poster_path}', '${type}', this)">
              ${inList ? '✓ In Watchlist' : '+ Add to Watchlist'}
            </button>
          </div>
        </div>`;
    }

    function toggleWatchlistBtn(id, poster, type, btn) {
      if (isInWatchlist(id)) {
        removeFromWatchlist(id);
        btn.className = 'btn btn-primary';
        btn.textContent = '+ Add to Watchlist';
      } else {
        addToWatchlist({ id, title: btn.closest('.modal-info').querySelector('h2').textContent, poster_path: poster, media_type: type });
        btn.className = 'btn btn-outline';
        btn.textContent = '✓ In Watchlist';
      }
    }

    function closeModal() {
      document.getElementById('modal-overlay').classList.remove('active');
    }

    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    document.getElementById('search-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
  </script>
</body>
</html>
