<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MovieMate – Search</title>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">Movie<span>Mate</span></div>
    <ul class="navbar-nav">
      <li><a href="home.html">Home</a></li>
      <li><a href="search.html" class="active">Search</a></li>
      <li><a href="watchlist.html">Watchlist</a></li>
      <li><a href="profile.html">Profile</a></li>
      <li><a href="#" onclick="logoutUser()">Logout</a></li>
    </ul>
  </nav>

  <div class="section">
    <h2 class="section-title">🔍 Search Movies & TV Shows</h2>
    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Search for a movie or TV show..." />
      <button class="btn btn-primary" onclick="doSearch()">Search</button>
    </div>
    <div id="search-results"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/watchlist.js"></script>
  <script src="../js/app.js"></script>
  <script>
    requireAuth();

    async function doSearch() {
      const query = document.getElementById('search-input').value.trim();
      if (!query) return;
      const container = document.getElementById('search-results');
      container.innerHTML = '<div class="loading"><div class="spinner"></div>Searching...</div>';
      const results = await searchMovies(query);
      container.innerHTML = '';
      if (!results || results.length === 0) {
        container.innerHTML = '<div class="empty-state"><h3>No results found</h3><p>Try a different search term.</p></div>';
        return;
      }
      const grid = document.createElement('div');
      grid.className = 'movies-grid';
      results.forEach(item => grid.appendChild(createCard(item)));
      container.appendChild(grid);
    }

    document.getElementById('modal-overlay').addEventListener('click', e => {
      if (e.target === document.getElementById('modal-overlay')) closeModal();
    });

    document.getElementById('search-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') doSearch();
    });
  </script>
</body>
</html>
